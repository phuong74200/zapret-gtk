# winws options for Zapret. Lines are joined with spaces; lines starting with #
# are comments. Write options as you would on the winws command line (quote
# paths that contain spaces). After editing, switch zapret off and on again.
#
# Default: zapret's own default strategy (as on Linux), applied to HTTP, HTTPS
# and QUIC. Find one tuned to your network with blockcheck from
# https://github.com/bol-van/zapret-win-bundle

# Which packets winws sees (WinDivert filter). Keep this line.
--wf-tcp=80,443 --wf-udp=443

# HTTP
--filter-tcp=80 --dpi-desync=fake,multisplit --dpi-desync-split-pos=method+2 --dpi-desync-fooling=md5sig --new

# HTTPS
--filter-tcp=443 --dpi-desync=fake,multidisorder --dpi-desync-split-pos=1,midsld --dpi-desync-fooling=badseq,md5sig --new

# QUIC (HTTP/3)
--filter-udp=443 --dpi-desync=fake --dpi-desync-repeats=6
